# =============================================================================
# Development Configuration
# =============================================================================
spring.application.name=Fitness Tracker API - Development
server.port=8080

# =============================================================================
# Database Configuration - MySQL (Development)
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_tracker_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=280219
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# JPA/Hibernate Configuration (Development - auto create)
# =============================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================================================
# JWT Configuration (Development)
# =============================================================================
jwt.secret=ThisIsADevelopmentSecretKeyForJwtTokenGenerationAndShouldBeChangedInProductionEnvironment
jwt.expiration=7200000
jwt.refresh-expiration=604800000
jwt.issuer=fitness-tracker-dev

# =============================================================================
# Logging Configuration (Development - verbose)
# =============================================================================
logging.level.root=INFO
logging.level.com.fitness.tracker=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# Swagger/OpenAPI Configuration
# =============================================================================
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html

# =============================================================================
# DevTools
# =============================================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
